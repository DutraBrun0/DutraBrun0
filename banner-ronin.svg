<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0810"/><stop offset=".7" stop-color="#22101a"/><stop offset="1" stop-color="#3a1420"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff4a3d"/><stop offset=".8" stop-color="#d4141f"/><stop offset="1" stop-color="#d4141f" stop-opacity="0"/></radialGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff2a2a" stop-opacity=".35"/><stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/></radialGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f5"/><stop offset="1" stop-color="#8c939e"/></linearGradient>
<linearGradient id="gleam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b3b" stop-opacity="0"/><stop offset=".5" stop-color="#ff3b3b" stop-opacity=".55"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></linearGradient>
<clipPath id="blade"><path d="M736 212 L858 258 L862 255 L740 207Z"/></clipPath>
</defs>
<style>
.serif{font-family:'Georgia','Times New Roman',serif;fill:#f1e6d6}
.sun{animation:pulse 4s ease-in-out infinite;transform-origin:700px 118px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),330px) rotate(540deg)}}
.gl{animation:gl 4s ease-in-out infinite}
@keyframes gl{0%,60%{transform:translateX(-140px)}85%,100%{transform:translateX(160px)}}
.cloud{animation:drift 14s ease-in-out infinite alternate}
.cloud2{animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-25px)}to{transform:translateX(25px)}}
.fade{animation:fade 2s ease-out both}
.fade2{animation:fade 2s ease-out .6s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.line{stroke-dasharray:300;animation:draw 1.6s ease-out .3s both}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.scarf{animation:scarf 1.8s ease-in-out infinite;transform-origin:712px 166px}
@keyframes scarf{0%,100%{transform:rotate(0) scaleX(1)}50%{transform:rotate(-6deg) scaleX(1.08)}}
.hair{animation:scarf 1.4s ease-in-out .3s infinite;transform-origin:716px 154px}
.sleeve{animation:sleeve 2.4s ease-in-out infinite;transform-origin:676px 172px}
@keyframes sleeve{0%,100%{transform:skewX(0)}50%{transform:skewX(-5deg)}}
.grass path{animation:sway 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
@keyframes sway{from{transform:skewX(6deg)}to{transform:skewX(-10deg)}}
@keyframes wind{0%{opacity:0;transform:translateX(0)}20%{opacity:.35}100%{opacity:0;transform:translateX(-160px)}}
.breath{animation:breath 3s ease-in-out infinite;transform-origin:700px 262px}
@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.008)}}
</style>
